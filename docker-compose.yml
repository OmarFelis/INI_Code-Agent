# ============================================
# Code-Agent — Docker Compose (desarrollo local)
# ============================================
# Levanta: API FastAPI + PostgreSQL 15
# Uso: docker compose up --build

services:
  # --- PostgreSQL ---
  db:
    image: postgres:15-alpine
    container_name: codeagent-db
    environment:
      POSTGRES_DB: codeagent_db
      POSTGRES_USER: codeagent
      POSTGRES_PASSWORD: codeagent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeagent -d codeagent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Code-Agent API ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codeagent-api
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://codeagent:codeagent@db:5432/codeagent_db
      LOG_LEVEL: INFO
      API_SECRET_TOKEN: local-dev-token
      AONE_SYNC_MODE: local
      ALLOWED_GIT_DOMAINS: bitbucket.org,github.com,gitlab.com
      GIT_USERNAME: "${GIT_USERNAME}"
      GIT_TOKEN: "${GIT_TOKEN}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - repos_cache:/app/repos_cache
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  repos_cache:
